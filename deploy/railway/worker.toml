# Railway service: Worker (BullMQ — news + alerts) — Config-as-code file
# Service settings: Root Directory = / (repo root), Config Path = deploy/railway/worker.toml
# No public port: background worker only.
[build]
dockerfilePath = "services/worker/Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
